name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A newer push to the same branch cancels the run that is still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: ci
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # A real Postgres server, so the database tests also run against the production driver.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: qa
          POSTGRES_PASSWORD: qa
          POSTGRES_DB: qa_assistant_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qa -d qa_assistant_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://qa:qa@localhost:5432/qa_assistant_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test:coverage

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Builds the image, and starts it with the demo AI to check that it really runs, as a user that is
  # not root, and answers its health check.
  docker:
    name: docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Compose file is valid
        run: docker compose --profile app config --quiet

      - name: Build the image
        run: docker build --tag qa-assistant:ci .

      - name: Start it and wait for it to be healthy
        run: |
          docker run --detach --name qa-assistant-ci --publish 3000:3000             --env AI_PROVIDER=fake --env DATABASE_URL=pglite://memory             --env API_TOKEN=ci-token-12345678 qa-assistant:ci
          for i in $(seq 1 30); do
            curl --silent --fail http://127.0.0.1:3000/health && break
            sleep 1
          done
          curl --silent --fail http://127.0.0.1:3000/ready
          curl --silent --head http://127.0.0.1:3000/ | grep -i "content-security-policy"
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:3000/api/jobs)" = "401"

      - name: It runs as a user that is not root
        run: test "$(docker exec qa-assistant-ci id -u)" != "0"

      - name: Show the log if something failed
        if: failure()
        run: docker logs qa-assistant-ci
